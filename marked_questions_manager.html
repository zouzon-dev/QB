<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>錯題標記管理</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', '微軟正黑體', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            font-weight: 600;
            color: #333;
        }

        .filter-group select,
        .filter-group input {
            padding: 8px 12px;
            border: 2px solid #667eea;
            border-radius: 6px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-warning {
            background: #ff9800;
            color: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-card .number {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-card .label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .questions-list {
            display: grid;
            gap: 20px;
        }

        .question-card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        .question-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
            gap: 15px;
        }

        .question-id {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .question-marks {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mark-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .mark-wrong {
            background: #ffcdd2;
            color: #c62828;
        }

        .mark-bookmark {
            background: #fff9c4;
            color: #f57f17;
        }

        .question-text {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .question-options {
            display: grid;
            gap: 10px;
            margin: 15px 0;
            margin-left: 20px;
        }

        .option {
            display: flex;
            align-items: start;
            gap: 10px;
            padding: 10px;
            background: white;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .option-label {
            font-weight: 600;
            color: #667eea;
            min-width: 30px;
        }

        .option-text {
            flex: 1;
            color: #555;
        }

        .option.correct .option-label {
            color: #4caf50;
        }

        .option.correct {
            background: #f1f8e9;
            border-color: #4caf50;
        }

        .explanation {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
            font-size: 0.95em;
            color: #2e7d32;
        }

        .explanation-label {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .question-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .edit-form {
            background: #f5f5f5;
            border: 2px dashed #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1em;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .form-group-checkbox input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .form-group-checkbox label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .empty-state-title {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #666;
        }

        .empty-state-text {
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .pagination button {
            padding: 8px 16px;
        }

        .pagination button.active {
            background: #667eea;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 6px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            border-left: 4px solid #4caf50;
        }

        .toast.error {
            border-left: 4px solid #f44336;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .filters {
                flex-direction: column;
            }

            .button-group {
                width: 100%;
                margin-left: 0;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .question-header {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 錯題標記管理</h1>
            <p>追蹤和管理做錯或收藏的題目，幫助你更有效地複習</p>
        </div>

        <div class="content">
            <!-- 統計卡片 -->
            <div class="stats">
                <div class="stat-card">
                    <div class="label">錯題總數</div>
                    <div class="number" id="totalWrong">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">收藏題目</div>
                    <div class="number" id="totalBookmark">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">全部標記</div>
                    <div class="number" id="totalMarked">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">複習進度</div>
                    <div class="number" id="reviewProgress">0%</div>
                </div>
            </div>

            <!-- 篩選區 -->
            <div class="filters">
                <div class="filter-group">
                    <label for="filterType">顯示類型：</label>
                    <select id="filterType">
                        <option value="all">全部</option>
                        <option value="wrong">只看錯題</option>
                        <option value="bookmark">只看收藏</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filterCategory">科目/單元：</label>
                    <select id="filterCategory">
                        <option value="">全部</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="searchKeyword">搜尋：</label>
                    <input type="text" id="searchKeyword" placeholder="搜尋題目...">
                </div>

                <div class="button-group">
                    <button class="btn-secondary" id="resetFilters">重置</button>
                    <button class="btn-primary" id="exportData">匯出</button>
                </div>
            </div>

            <!-- 題目列表 -->
            <div class="questions-list" id="questionsList"></div>

            <!-- 載入中 -->
            <div class="loading" id="loadingState" style="display: none;">
                ⏳ 正在載入資料...
            </div>

            <!-- 空狀態 -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-state-icon">📚</div>
                <div class="empty-state-title">沒有標記的題目</div>
                <div class="empty-state-text">開始做題測驗，系統會自動記錄你的錯題</div>
            </div>

            <!-- 分頁 -->
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- 編輯模態窗 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">編輯題目</div>
            <div class="edit-form" id="editForm">
                <div class="form-group">
                    <label>題目ID</label>
                    <input type="text" id="editQID" readonly>
                </div>
                <div class="form-group">
                    <label for="editQuestion">題目敘述</label>
                    <textarea id="editQuestion" readonly></textarea>
                </div>
                <div class="form-group">
                    <label for="editOptA">選項 A</label>
                    <input type="text" id="editOptA" readonly>
                </div>
                <div class="form-group">
                    <label for="editOptB">選項 B</label>
                    <input type="text" id="editOptB" readonly>
                </div>
                <div class="form-group">
                    <label for="editOptC">選項 C</label>
                    <input type="text" id="editOptC" readonly>
                </div>
                <div class="form-group">
                    <label for="editOptD">選項 D</label>
                    <input type="text" id="editOptD" readonly>
                </div>
                <div class="form-group">
                    <label for="editCorrect">正確答案</label>
                    <input type="text" id="editCorrect" readonly>
                </div>
                <div class="form-group">
                    <label for="editExplanation">詳解</label>
                    <textarea id="editExplanation" readonly></textarea>
                </div>
                <div class="form-group-checkbox">
                    <input type="checkbox" id="editIsWrong">
                    <label for="editIsWrong">標記為錯題</label>
                </div>
                <div class="form-group-checkbox">
                    <input type="checkbox" id="editIsBookmark">
                    <label for="editIsBookmark">標記為收藏</label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelEdit">取消</button>
                <button class="btn-primary" id="saveEdit">保存</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== Supabase 初始化 ====================
        const SUPABASE_URL = "https://cebkdvpquzzlvyrhinto.supabase.co";[cite: 1]
        const SUPABASE_KEY = "sb_publishable_nMJezib-NsDHpvDSLLXHaw_9005bSpQ";[cite: 1]
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);[cite: 1]

        let currentUserId = null;[cite: 1]

        // ==================== 資料管理 ====================
        class MarkedQuestionsManager {
            constructor() {
                this.questions = [];[cite: 1]
                this.filteredQuestions = [];[cite: 1]
                this.currentPage = 1;[cite: 1]
                this.itemsPerPage = 5;[cite: 1]
                this.editingQuestionId = null;[cite: 1]
                this.allQuestions = {}; // 快取所有題目[cite: 1]
                this.init();[cite: 1]
            }

            async init() {
                const loadingEl = document.getElementById('loadingState');[cite: 1]
                try {
                    loadingEl.style.display = 'block';[cite: 1]

                    // 1. 驗證使用者登入狀態
                    const { data: { user }, error: authError } = await supabaseClient.auth.getUser();[cite: 1]
                    if (authError || !user) {
                        console.warn("使用者未登入或 Session 已過期", authError);[cite: 1]
                        alert("請先登入系統！");[cite: 1]
                        window.location.href = "auth.html";[cite: 1]
                        return;[cite: 1]
                    }
                    currentUserId = user.id;[cite: 1]

                    // 2. 載入資料
                    await this.loadData();[cite: 1]
                    this.setupEventListeners();[cite: 1]
                    this.renderQuestions();[cite: 1]
                    this.updateStats();[cite: 1]
                } catch (error) {
                    console.error('初始化失敗:', error);[cite: 1]
                    this.showToast('載入失敗，請重試', 'error');[cite: 1]
                } finally {
                    // 無論成功或失敗均關閉 Loading[cite: 1]
                    loadingEl.style.display = 'none';[cite: 1]
                }
            }

            async loadData() {
                try {
                    // 1. 載入所有題目到快取
                    const { data: allQuestionsData, error: allQuestionsError } = await supabaseClient
                        .from('questions')[cite: 1]
                        .select('*')[cite: 1]
                        .order('id', { ascending: true });[cite: 1]

                    if (allQuestionsError) throw allQuestionsError;[cite: 1]

                    (allQuestionsData || []).forEach(q => {
                        this.allQuestions[q.id] = q;[cite: 1]
                    });

                    // 2. 載入該使用者的標記題目 (方案A：依 updated_at 排序)
                    const { data: markedData, error: markedError } = await supabaseClient
                        .from('marked_questions')[cite: 1]
                        .select('*')[cite: 1]
                        .eq('user_id', currentUserId)[cite: 1]
                        .order('updated_at', { ascending: false });

                    if (markedError) throw markedError;[cite: 1]

                    // 3. 組合資料：標記資訊 + 題目內容
                    this.questions = (markedData || []).map(marked => {
                        const questionData = this.allQuestions[marked.question_id] || {};[cite: 1]
                        return {
                            id: marked.question_id,[cite: 1]
                            categoryId: questionData.category_id || 0,[cite: 1]
                            categoryName: questionData.category_name || '未分類',[cite: 1]
                            question: questionData.question_text || '題目文字已不存在',[cite: 1]
                            options: {
                                A: questionData.option_a || '',[cite: 1]
                                B: questionData.option_b || '',[cite: 1]
                                C: questionData.option_c || '',[cite: 1]
                                D: questionData.option_d || ''[cite: 1]
                            },
                            correct: questionData.correct_answer || '',[cite: 1]
                            explanation: questionData.explanation || '',[cite: 1]
                            isWrongHistory: marked.is_wrong_history || false,[cite: 1]
                            isBookmarked: marked.is_bookmarked || false,[cite: 1]
                            timestamp: marked.updated_at ? new Date(marked.updated_at) : new Date(),
                            markedId: marked.id[cite: 1]
                        };
                    });

                    this.applyFilters();[cite: 1]
                } catch (error) {
                    console.error('載入資料失敗:', error);[cite: 1]
                    throw error;[cite: 1]
                }
            }

            setupEventListeners() {
                document.getElementById('filterType').addEventListener('change', () => this.applyFilters());[cite: 1]
                document.getElementById('filterCategory').addEventListener('change', () => this.applyFilters());[cite: 1]
                document.getElementById('searchKeyword').addEventListener('input', () => this.applyFilters());[cite: 1]
                document.getElementById('resetFilters').addEventListener('click', () => this.resetFilters());[cite: 1]
                document.getElementById('exportData').addEventListener('click', () => this.exportData());[cite: 1]
                document.getElementById('cancelEdit').addEventListener('click', () => this.closeEditModal());[cite: 1]
                document.getElementById('saveEdit').addEventListener('click', () => this.saveEdits());[cite: 1]

                this.loadCategories();[cite: 1]
            }

            loadCategories() {
                const categories = [...new Set(
                    this.questions.map(q => ({ id: q.categoryId, name: q.categoryName }))[cite: 1]
                )];
                const select = document.getElementById('filterCategory');[cite: 1]
                select.innerHTML = '<option value="">全部</option>';[cite: 1]
                categories.forEach(cat => {
                    const option = document.createElement('option');[cite: 1]
                    option.value = cat.id;[cite: 1]
                    option.textContent = cat.name;[cite: 1]
                    select.appendChild(option);[cite: 1]
                });
            }

            applyFilters() {
                const filterType = document.getElementById('filterType').value;[cite: 1]
                const filterCategory = document.getElementById('filterCategory').value;[cite: 1]
                const searchKeyword = document.getElementById('searchKeyword').value.toLowerCase();[cite: 1]

                this.filteredQuestions = this.questions.filter(q => {
                    let typeMatch = true;[cite: 1]
                    if (filterType === 'wrong') typeMatch = q.isWrongHistory;[cite: 1]
                    if (filterType === 'bookmark') typeMatch = q.isBookmarked;[cite: 1]

                    const categoryMatch = !filterCategory || q.categoryId == filterCategory;[cite: 1]
                    const searchMatch = !searchKeyword ||
                        q.question.toLowerCase().includes(searchKeyword) ||
                        Object.values(q.options).some(opt => opt.toLowerCase().includes(searchKeyword));[cite: 1]

                    return typeMatch && categoryMatch && searchMatch;[cite: 1]
                });

                this.currentPage = 1;[cite: 1]
                this.renderQuestions();[cite: 1]
            }

            resetFilters() {
                document.getElementById('filterType').value = 'all';[cite: 1]
                document.getElementById('filterCategory').value = '';[cite: 1]
                document.getElementById('searchKeyword').value = '';[cite: 1]
                this.applyFilters();[cite: 1]
                this.showToast('篩選已重置', 'success');[cite: 1]
            }

            updateStats() {
                const totalWrong = this.questions.filter(q => q.isWrongHistory).length;[cite: 1]
                const totalBookmark = this.questions.filter(q => q.isBookmarked).length;[cite: 1]
                const totalMarked = this.questions.filter(q => q.isWrongHistory || q.isBookmarked).length;[cite: 1]
                const reviewProgress = totalMarked > 0 ? Math.round((totalMarked / this.questions.length) * 100) : 0;[cite: 1]

                document.getElementById('totalWrong').textContent = totalWrong;[cite: 1]
                document.getElementById('totalBookmark').textContent = totalBookmark;[cite: 1]
                document.getElementById('totalMarked').textContent = totalMarked;[cite: 1]
                document.getElementById('reviewProgress').textContent = reviewProgress + '%';[cite: 1]
            }

            renderQuestions() {
                const container = document.getElementById('questionsList');[cite: 1]
                const emptyState = document.getElementById('emptyState');[cite: 1]

                if (this.filteredQuestions.length === 0) {
                    container.innerHTML = '';[cite: 1]
                    emptyState.style.display = 'block';[cite: 1]
                    document.getElementById('pagination').innerHTML = '';[cite: 1]
                    return;[cite: 1]
                }

                emptyState.style.display = 'none';[cite: 1]

                const start = (this.currentPage - 1) * this.itemsPerPage;[cite: 1]
                const end = start + this.itemsPerPage;[cite: 1]
                const pageQuestions = this.filteredQuestions.slice(start, end);[cite: 1]

                container.innerHTML = pageQuestions.map(q => this.createQuestionCard(q)).join('');[cite: 1]
                this.renderPagination();[cite: 1]
            }

            createQuestionCard(q) {
                const correctOptionKey = q.correct;[cite: 1]

                return `
                    <div class="question-card" data-id="${q.id}">
                        <div class="question-header">
                            <div>
                                <span class="question-id">第 ${q.id} 題</span>
                                <div class="question-marks" style="margin-top: 8px;">
                                    ${q.isWrongHistory ? '<span class="mark-badge mark-wrong">❌ 錯題</span>' : ''}
                                    ${q.isBookmarked ? '<span class="mark-badge mark-bookmark">⭐ 收藏</span>' : ''}
                                </div>
                            </div>
                            <div style="font-size: 0.85em; color: #999;">
                                ${new Date(q.timestamp).toLocaleDateString('zh-TW')}
                            </div>
                        </div>

                        <div class="question-text">${escapeHtml(q.question)}</div>

                        <div class="question-options">
                            ${Object.entries(q.options).map(([key, text]) => `
                                <div class="option ${key === correctOptionKey ? 'correct' : ''}">
                                    <span class="option-label">${key}</span>
                                    <span class="option-text">${escapeHtml(text)}</span>
                                    ${key === correctOptionKey ? '<span style="margin-left: auto; color: #4caf50;">✓ 正確</span>' : ''}
                                </div>
                            `).join('')}
                        </div>

                        ${q.explanation ? `
                            <div class="explanation">
                                <div class="explanation-label">📖 詳解</div>
                                <div>${escapeHtml(q.explanation)}</div>
                            </div>
                        ` : ''}

                        <div class="question-actions">
                            <button class="action-btn btn-primary" onclick="manager.openEditModal(${q.id})">
                                ✏️ 檢視
                            </button>
                            <button class="action-btn btn-warning" onclick="manager.toggleMark(${q.id}, 'wrong')">
                                ${q.isWrongHistory ? '❌' : '⭕'} 錯題
                            </button>
                            <button class="action-btn btn-warning" onclick="manager.toggleMark(${q.id}, 'bookmark')">
                                ${q.isBookmarked ? '⭐' : '☆'} 收藏
                            </button>
                            <button class="action-btn btn-danger" onclick="manager.deleteQuestion(${q.id})">
                                🗑️ 移除
                            </button>
                        </div>
                    </div>
                `;[cite: 1]
            }

            renderPagination() {
                const totalPages = Math.ceil(this.filteredQuestions.length / this.itemsPerPage);[cite: 1]
                const pagination = document.getElementById('pagination');[cite: 1]
                pagination.innerHTML = '';[cite: 1]

                if (totalPages <= 1) return;[cite: 1]

                for (let i = 1; i <= totalPages; i++) {
                    const btn = document.createElement('button');[cite: 1]
                    btn.textContent = i;[cite: 1]
                    btn.className = i === this.currentPage ? 'btn-secondary active' : 'btn-secondary';[cite: 1]
                    btn.onclick = () => {
                        this.currentPage = i;[cite: 1]
                        this.renderQuestions();[cite: 1]
                    };
                    pagination.appendChild(btn);[cite: 1]
                }
            }

            async toggleMark(id, type) {
                const question = this.questions.find(q => q.id === id);[cite: 1]
                if (!question) return;[cite: 1]

                try {
                    if (type === 'wrong') {
                        question.isWrongHistory = !question.isWrongHistory;[cite: 1]
                    } else if (type === 'bookmark') {
                        question.isBookmarked = !question.isBookmarked;[cite: 1]
                    }

                    // 更新 marked_questions，更新時會寫入 updated_at
                    const { error } = await supabaseClient
                        .from('marked_questions')[cite: 1]
                        .update({
                            is_wrong_history: question.isWrongHistory,[cite: 1]
                            is_bookmarked: question.isBookmarked,
                            updated_at: new Date().toISOString()
                        })
                        .eq('id', question.markedId);[cite: 1]

                    if (error) throw error;[cite: 1]

                    this.applyFilters();[cite: 1]
                    this.updateStats();[cite: 1]
                    this.showToast('標記已更新', 'success');[cite: 1]
                } catch (error) {
                    console.error('更新標記失敗:', error);[cite: 1]
                    this.showToast('更新失敗，請重試', 'error');[cite: 1]
                }
            }

            openEditModal(id) {
                const question = this.questions.find(q => q.id === id);[cite: 1]
                if (!question) return;[cite: 1]

                this.editingQuestionId = id;[cite: 1]
                document.getElementById('editQID').value = question.id;[cite: 1]
                document.getElementById('editQuestion').value = question.question;[cite: 1]
                document.getElementById('editOptA').value = question.options.A;[cite: 1]
                document.getElementById('editOptB').value = question.options.B;[cite: 1]
                document.getElementById('editOptC').value = question.options.C;[cite: 1]
                document.getElementById('editOptD').value = question.options.D;[cite: 1]
                document.getElementById('editCorrect').value = question.correct;[cite: 1]
                document.getElementById('editExplanation').value = question.explanation;[cite: 1]
                document.getElementById('editIsWrong').checked = question.isWrongHistory;[cite: 1]
                document.getElementById('editIsBookmark').checked = question.isBookmarked;[cite: 1]

                document.getElementById('editModal').classList.add('active');[cite: 1]
            }

            closeEditModal() {
                document.getElementById('editModal').classList.remove('active');[cite: 1]
                this.editingQuestionId = null;[cite: 1]
            }

            async saveEdits() {
                const question = this.questions.find(q => q.id === this.editingQuestionId);[cite: 1]
                if (!question) return;[cite: 1]

                try {
                    const { error } = await supabaseClient
                        .from('marked_questions')[cite: 1]
                        .update({
                            is_wrong_history: document.getElementById('editIsWrong').checked,[cite: 1]
                            is_bookmarked: document.getElementById('editIsBookmark').checked,
                            updated_at: new Date().toISOString()
                        })
                        .eq('id', question.markedId);[cite: 1]

                    if (error) throw error;[cite: 1]

                    question.isWrongHistory = document.getElementById('editIsWrong').checked;[cite: 1]
                    question.isBookmarked = document.getElementById('editIsBookmark').checked;[cite: 1]

                    this.closeEditModal();[cite: 1]
                    this.applyFilters();[cite: 1]
                    this.updateStats();[cite: 1]
                    this.showToast('題目已保存', 'success');[cite: 1]
                } catch (error) {
                    console.error('保存失敗:', error);[cite: 1]
                    this.showToast('保存失敗，請重試', 'error');[cite: 1]
                }
            }

            async deleteQuestion(id) {
                if (!confirm('確定要移除這題嗎？')) return;[cite: 1]

                try {
                    const question = this.questions.find(q => q.id === id);[cite: 1]
                    if (!question) return;[cite: 1]

                    const { error } = await supabaseClient
                        .from('marked_questions')[cite: 1]
                        .delete()[cite: 1]
                        .eq('id', question.markedId);[cite: 1]

                    if (error) throw error;[cite: 1]

                    this.questions = this.questions.filter(q => q.id !== id);[cite: 1]
                    this.applyFilters();[cite: 1]
                    this.updateStats();[cite: 1]
                    this.showToast('題目已移除', 'success');[cite: 1]
                } catch (error) {
                    console.error('刪除失敗:', error);[cite: 1]
                    this.showToast('刪除失敗，請重試', 'error');[cite: 1]
                }
            }

            exportData() {
                const data = {
                    exportDate: new Date().toLocaleString('zh-TW'),[cite: 1]
                    totalQuestions: this.questions.length,[cite: 1]
                    wrongQuestions: this.questions.filter(q => q.isWrongHistory).length,[cite: 1]
                    bookmarkedQuestions: this.questions.filter(q => q.isBookmarked).length,[cite: 1]
                    questions: this.questions[cite: 1]
                };

                const json = JSON.stringify(data, null, 2);[cite: 1]
                const blob = new Blob([json], { type: 'application/json' });[cite: 1]
                const url = URL.createObjectURL(blob);[cite: 1]
                const a = document.createElement('a');[cite: 1]
                a.href = url;[cite: 1]
                a.download = `marked_questions_${new Date().getTime()}.json`;[cite: 1]
                a.click();[cite: 1]
                URL.revokeObjectURL(url);[cite: 1]

                this.showToast('資料已匯出', 'success');[cite: 1]
            }

            showToast(message, type = 'success') {
                const toast = document.createElement('div');[cite: 1]
                toast.className = `toast ${type}`;[cite: 1]
                toast.textContent = message;[cite: 1]
                document.body.appendChild(toast);[cite: 1]

                setTimeout(() => {
                    toast.style.animation = 'slideIn 0.3s ease reverse';[cite: 1]
                    setTimeout(() => toast.remove(), 300);[cite: 1]
                }, 2000);
            }
        }

        // 防止 XSS 攻擊
        function escapeHtml(str) {
            if (!str) return '';[cite: 1]
            const div = document.createElement('div');[cite: 1]
            div.textContent = str;[cite: 1]
            return div.innerHTML;[cite: 1]
        }

        // ==================== 初始化 ====================
        let manager;[cite: 1]
        document.addEventListener('DOMContentLoaded', () => {
            manager = new MarkedQuestionsManager();[cite: 1]
        });
    </script>
</body>
</html>
